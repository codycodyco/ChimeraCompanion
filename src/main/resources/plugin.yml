name: ChimeraCompanion
version: '${version}'
main: chimera.ChimeraCompanionPlugin
api-version: '26.2'
description: A lightweight companion pet for Paper 26.2
author: cody
commands:
  chimera:
    description: Summon or dismiss your Chimera companion
    usage: /chimera <summon|dismiss|bubble|testtrigger|reload>
permissions:
  chimera.admin:
    description: Allows reloading the ChimeraCompanion configuration
    default: op
