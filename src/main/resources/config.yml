# Seconds between two random lines of a companion, picked randomly from this range.
dialogue:
  interval-min: 60
  interval-max: 180
  messages:
    - "今天也要好好上班呀～"
    - "老板，摸鱼记得看看四周呢～"
    - "这附近好像有钻石的味道～"
    - "走这么快，是在躲我吗～"
    - "又挖矿呀，真拼呢～"

# Lines shown for behaviour triggers, addressed by id (for example mining.diamond).
# Every normal trigger shares the same per-player cooldown.
triggers:
  cooldown-seconds: 60
  mining:
    diamond:
      messages:
        - "老板运气真好呢～"
        - "今天也很努力呀～"
  death:
    fall:
      messages:
        - "老板好喜欢地面呢～"
